# Veřejná inventura. Žádná hesla, tokeny, MAC ani veřejné IP WAN.
# Soukromé overlay: hosts.local.yml (gitignored)
# Návody: docs/SOURCES.md (zimacek.cz)

site:
  timezone: Europe/Prague
  git: https://github.com/ZiMi-lab/homelab-docker
  docs: https://zimacek.cz/dokumentace/home-lab/

tls:
  internal: letsencrypt-dns01 # NPM + Cloudflare API
  public_access: cloudflare-tunnel
  notes: Důvěryhodné certifikáty. Self-signed není default.

dns:
  lan: mikrotik-static
  resolver: cloudflare-doh-security # https://security.cloudflare-dns.com/dns-query (1.1.1.2)
  adlist: stevenblack-hosts
  force_lan_dns: true # :53 na router, drop DNS z WAN, drop DoT 853; IPv6 stejně
  notes: >
    Interní FQDN → CNAME na NPM. FQDN, CIDR a DNS výjimky jen v hosts.local.yml.
    NextDNS se už nepoužívá.

network:
  router: mikrotik
  remote_admin: wireguard
  vlans:
    - name: trusted
      role: PC, správa, Docker LXC, TrueNAS, PVE
    - name: iot
    - name: guest
    - name: cameras
    - name: management

truenas:
  name: truenas
  hostname: nas # FQDN v hosts.local.yml
  version: "26.10"
  role: NAS, ZFS, TrueNAS Apps, Proxmox qdevice host
  qdevice:
    enabled: true
    runtime: truenas-lxc
    software: corosync-qnetd
    notes: Třetí hlas PVE clusteru. Blog popisuje Debian VM; aktuálně LXC.
  apps:
    - name: bitcoind-knots
      train: community
      notes: Bitcoin Knots. Docs v bitcoin/bitcoind-knots/
    - name: immich
      train: community
      notes: Datasety immich/data a immich/postgres, owner apps. Přístup z internetu přes tunnel.
  datasets:
    - name: immich/data
      purpose: Immich library
    - name: immich/postgres
      purpose: Immich DB

proxmox:
  version: "9"
  cluster: clustered+qdevice
  notifications: gmail-smtp # Datacenter → Notifications, App Password
  ha:
    enabled: true
    storage: replication # ne sdílené Ceph; viz blog
    examples:
      - Home Assistant
  qdevice:
    runtime: truenas-lxc
    notes: corosync-qnetd na TrueNAS, port 5403/TCP.
  nodes:
    - name: proxmox1
      hostname: proxmox1 # FQDN v hosts.local.yml
      role: compute
    - name: proxmox2
      hostname: proxmox2
      role: compute
  docker_lxc:
    enabled: true
    ctid: null # TODO
    hostname: docker # FQDN v hosts.local.yml
    portainer: true
    compose_runtime: portainer # YAML dnes v /data/compose/<id>/v<n>/
    notes: Cesta v<n> není stabilní. Cíl = git + Portainer Repository.

bitcoin:
  node_host: truenas
  implementation: knots
  pruned: unknown
  txindex: unknown
  rpc_port: 8332
  p2p_port: 8333
  zmq_rawblock_port: 28332
  zmq_rawtx_port: 28333
  datadir: /mnt/POOL/apps/bitcoind-knots # TODO
  electrum_port: 50001

services:
  - name: portainer
    path: portainer/
    runtime: proxmox-lxc
    access: lan-npm
  - name: nginx-proxy-manager
    path: nginx-proxy-manager/
    portainer_stack: nginx-proxy-manager-stack
    runtime: proxmox-lxc
    access: lan
    notes: Interní HTTPS, LE DNS-01. Admin :81 jen LAN/WG.
  - name: cf_tunnel
    path: cloudflared/
    portainer_stack: cf_tunnel
    runtime: proxmox-lxc
    access: cloudflare-tunnel
  - name: netalertx
    path: netalertx/
    portainer_stack: netalertx-stack
    runtime: proxmox-lxc
    access: lan-npm
  - name: homarr
    path: homarr/
    portainer_stack: homarr-stack
    runtime: proxmox-lxc
    access: lan-npm
  - name: postgres
    path: postgres/
    portainer_stack: postgres
    runtime: proxmox-lxc
    access: lan
    notes: Vývojové PostgreSQL 16, jen LAN. Šablona v postgres/; hesla a názvy DB v Portainer env.
  - name: umami
    path: umami/
    runtime: proxmox-lxc
    access: cloudflare-tunnel
  - name: uptime-kuma
    path: uptime-kuma/
    runtime: proxmox-lxc
    access: lan-npm
  - name: immich
    path: immich/
    runtime: truenas-app
    access: cloudflare-tunnel
    notes: Google SSO, password login vypnutý.
