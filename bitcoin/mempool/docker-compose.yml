services:
  db:
    image: mariadb:11
    container_name: mempool-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Prague}
      MYSQL_DATABASE: mempool
      MYSQL_USER: mempool
      MYSQL_PASSWORD: ${MEMPOOL_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MEMPOOL_DB_ROOT_PASSWORD}
    volumes:
      - mempool_db:/var/lib/mysql

  api:
    image: mempool/backend:v3.2.1
    container_name: mempool-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    environment:
      TZ: ${TZ:-Europe/Prague}
      CORE_RPC_HOST: ${BITCOIN_RPC_HOST}
      CORE_RPC_PORT: ${BITCOIN_RPC_PORT}
      CORE_RPC_USERNAME: ${BITCOIN_RPC_USER}
      CORE_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD}
      ELECTRUM_HOST: ${ELECTRUM_HOST}
      ELECTRUM_PORT: ${ELECTRUM_PORT}
      ELECTRUM_TLS_ENABLED: "false"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: db
      DATABASE_DATABASE: mempool
      DATABASE_USERNAME: mempool
      DATABASE_PASSWORD: ${MEMPOOL_DB_PASSWORD}
      MEMPOOL_BACKEND: electrum
      STATISTICS_ENABLED: "true"

  web:
    image: mempool/frontend:v3.2.1
    container_name: mempool-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: ${TZ:-Europe/Prague}
      FRONTEND_HTTP_PORT: "8080"
      BACKEND_MAINNET_HTTP_HOST: api
    ports:
      - "${MEMPOOL_HTTP_PORT:-8080}:8080"

volumes:
  mempool_db:
