services:
  app:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - nginx_proxy_manager_data:/data
      - nginx_proxy_manager_letsencrypt:/etc/letsencrypt

volumes:
  nginx_proxy_manager_letsencrypt:
    external: true
  nginx_proxy_manager_data:
    external: true
